name: GPT isolated daily API recalculation
on:
  push:
    branches: [audit/gpt-daily-api-20261010]
    paths: [.github/workflows/gpt-daily-api-audit.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: gpt-daily-audit-read-only
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kis-token-box
          key: gpt-audit-token-read-${{ github.run_id }}
          restore-keys: kis-token-
      - uses: ./.github/actions/kis-token-open
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
      - name: Remove failed diagnostic artifact
        env:
          GH_AUDIT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          req=urllib.request.Request('https://api.github.com/repos/ppx109-crypto/stock-dash/actions/artifacts/11649923502',method='DELETE',headers={'Authorization':'Bearer '+os.environ['GH_AUDIT_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:print('Diagnostic artifact removed:',r.status)
          except urllib.error.HTTPError as e:
              if e.code!=404:raise RuntimeError('Cleanup failed')
              print('Diagnostic artifact already absent')
          PY
      - name: Independent market-data-only calculation
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python audit/gpt-daily-api/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-daily-api-derived-audit
          path: audit-daily-output/
          retention-days: 7
