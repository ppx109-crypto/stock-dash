name: KIS extra history
# 한국투자증권에서 과거(2017~)까지 주는 자료를 더 모읍니다(새 RL 재료). 조회 전용입니다.
# kind: program(종목별 프로그램매매) · loan(대차거래) · side(매수·매도 체결량) · market(지수·시장 투자자·시장 프로그램·증시자금) · ratio(재무비율) · all
# 종목 묶음마다 커밋하므로, 제한 시간에 걸려도 다시 돌리면 받은 데서 이어 갑니다.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'program · loan · side · market · ratio · all'
        required: false
        default: 'all'
      batch:
        description: '한 묶음에 몇 종목씩 받고 커밋할지'
        required: false
        default: '30'
permissions:
  contents: write
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_kis_extra -v
      - name: Collect, saving each batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          push() {
            git add -A program-data loan-data side-data market-data ratio-data 2>/dev/null
            if ! git diff --cached --quiet; then
              git commit -q -m "Collect KIS extra history ($1)"
              git pull -q --rebase origin main && git push -q
            fi
          }
          kinds="$KIND"; [ "$kinds" = "all" ] && kinds="market ratio program loan side"
          for kind in $kinds; do
            if [ "$kind" = "market" ]; then python collect_kis_extra.py market || true; push market; continue; fi
            python - <<'PY' > /tmp/batches.txt
          import json, os, re
          from pathlib import Path
          picked = json.loads(Path("study/flow_universe.json").read_text(encoding="utf-8"))["codes"]
          picked = [c for c in picked if re.fullmatch(r"[0-9]{6}", c)]
          size = int(os.getenv("BATCH", "30"))
          for k in range(0, len(picked), size):
              print(",".join(picked[k:k + size]))
          PY
            while read -r batch; do
              [ -z "$batch" ] && continue
              status=0; INVESTOR_CODES="$batch" python collect_kis_extra.py "$kind" || status=$?
              push "$kind"
              if [ "$status" = "2" ]; then echo '거절이 이어져 멈춥니다.'; exit 1; fi
            done < /tmp/batches.txt
          done
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIND: ${{ inputs.kind || 'all' }}
          BATCH: ${{ inputs.batch || '30' }}
