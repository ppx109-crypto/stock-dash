name: Live quote check (장중 실시간 확인)
# 대시보드가 쓰는 같은 한투 함수(index_now · quote)로 코스피 · 종목 지금 값을 1분 간격 세 번 받아 장중에 바뀌는지 확인.
# 사용자 2026-10-07 "장중 실시간으로 변하는지 확인해줘". 값만 찍음(키 · 계좌 · 응답 본문은 안 찍음). 손으로 · 평일 10:05에 한 번.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드(빈칸 구분, 비우면 069500 005930 251340)'
        required: false
        default: ''
  schedule:
    - cron: '5 1 * * 1-5'            # 한국 시각 10:05(평일)
permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/kis-token-open
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_live_check -v
      - name: 장중 실시간 확인
        run: |
          for c in $CODES; do case "$c" in [0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "종목코드는 숫자 6자리"; exit 1;; esac; done
          python live_check.py $CODES
        env:
          CODES: ${{ inputs.codes || '' }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
      - if: always()
        uses: ./.github/actions/kis-token-close
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
