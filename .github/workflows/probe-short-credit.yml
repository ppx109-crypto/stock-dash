name: Probe short and credit history
# 증권사가 종목별 공매도·신용잔고를 과거까지 주는지 한 번 찔러 봅니다. 저장하지 않습니다.
on:
  workflow_dispatch:
    inputs:
      code:
        description: '찔러 볼 종목코드'
        required: false
        default: '005930'
permissions:
  contents: read
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Ask by date
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          CODE: ${{ inputs.code }}
        run: python probe_short_credit.py "$CODE"
