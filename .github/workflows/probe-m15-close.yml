name: Probe 15-minute close
# 15분봉 마지막 칸이 장 마감 단일가를 빠뜨린 까닭 찾기(손으로만 실행 · 조회만 · 저장하지 않음). 시각 · 값 · 거래량만 찍습니다.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드(쉼표)'
        required: false
        default: '000250,000080,005930,000270,069500'
      days:
        description: '날짜(쉼표)'
        required: false
        default: '20261001,20261002'
permissions:
  contents: read
concurrency:
  group: probe-m15-close
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python research/probe_m15_close.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.1'
          PROBE_CODES: ${{ inputs.codes || '000250,000080,005930,000270,069500' }}
          PROBE_DAYS: ${{ inputs.days || '20261001,20261002' }}
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
