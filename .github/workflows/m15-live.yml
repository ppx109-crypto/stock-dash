name: M15 live
# 15분봉 규칙(15분봉 22회차 후보) — 장중 15분마다 방금 닫힌 15분봉으로 매수 · 자리 바꾸기 · 익절 · 손절 · 청산을 판단해 디스코드로 알리고,
# 모의투자 비밀값이 있으면 한투 모의투자 계좌에만 시장가 주문(실전 계좌 주문 없음 · 계좌의 20% 몫 · 사용자 2026-10-02 '2번 15m 모의도 진행').
# 후보는 1시간봉과 같은 hourly-live/plan.json. 1시간봉(매시 1분)과 접근토큰이 겹치지 않게 봉이 닫힌 뒤 3분에 돎. 늦으면 밀린 봉을 차례로 처리.
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 0-6 * * 1-5'   # 한국 시각 09:03 ~ 15:48(평일) — 09:03은 전날 정한 매도 · 정배열 깨짐을 09시 시가에
permissions:
  contents: write
  actions: read
concurrency:
  group: m15-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - id: gate
        name: 장중 상주 작업(Intraday runner)이 돌면 건너뜀 — 이 예약은 뒷받침용
        run: |
          [ "${{ github.event_name }}" = schedule ] || exit 0
          n=""
          for i in 1 2 3; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/intraday.yml/runs?status=in_progress" --jq '.total_count' 2>/dev/null || true)
            case "$n" in ''|*[!0-9]*) n=""; sleep 5;; *) break;; esac
          done
          if [ -z "$n" ]; then
            # 상주 작업이 도는지 끝내 모르면 건너뜀(둘이 같은 봉을 처리해 주문이 겹치는 것보다 한 회차 늦는 게 나음 · 봇이 밀린 봉을 처리)
            echo "상주 작업 확인에 실패해 이번 예약은 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ "$n" -gt 0 ]; then
            echo "장중 상주 작업이 돌고 있어 이번 예약은 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: main
      - if: steps.gate.outputs.skip != '1'
        uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.skip != '1'
        run: pip install requests numpy
      - if: steps.gate.outputs.skip != '1'
        run: python -m unittest tests.test_m15_live tests.test_paper_trade tests.test_acc_cap -v
      - if: steps.gate.outputs.skip != '1'
        name: 15분봉 판단 · 디스코드 알림 · 연습 계좌 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python m15_live.py || status=$?
          mkdir -p m15-live
          mkdir -p basket-live && git add -A m15-live idle-live basket-live          # 규칙이 살 돈이 모자라 빈칸 엔진이 자리를 내준 기록도
          if ! git diff --cached --quiet; then
            git commit -q -m "M15 live"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 한투 모의투자 자동 주문(15분봉 몫 20%). 끄려면 M15_PAPER를 'off'로 · 모든 모의 주문을 끄려면 hourly-live/paper-off 파일.
          M15_PAPER: 'on'
          # 계좌 흔들림 상한(acc_cap.py · 사용자 2026-10-09 "main에 넣고 켜라") — 15분봉 사기도 'E × 계좌 − 든 것'까지
          ACC_CAP: 'on'
          ACC_CAP_START: '20261012'
          PAPER_TRADING: 'on'
          PAPER_START: '20261002'
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT: ${{ secrets.KIS_PAPER_ACCOUNT }}
          KIS_PAPER_TOKEN_FILE: ${{ runner.temp }}/kis-paper-token.json
      - if: always() && steps.gate.outputs.skip != '1'
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
