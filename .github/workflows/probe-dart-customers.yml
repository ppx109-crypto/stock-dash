name: Probe DART customers
# 사업보고서 원문에 '주요 매출처 · 주요 고객'이 이름까지 적혀 있는지 찔러 봅니다(조회 전용 · 호출 약 100번).
# 결과(공시 원문 일부)는 customer-probe/probe.json으로 같은 브랜치에 올립니다.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-dart-customers.yml'
      - 'probe_dart_customers.py'
permissions:
  contents: write
concurrency:
  group: dart-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: DART
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
        run: python probe_dart_customers.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-probe
          git diff --cached --quiet && exit 0
          git commit -m "DART 주요 매출처 찔러 보기 결과"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
