name: KIS 15-minute bars
# 한국투자증권 1분봉(약 1년치)을 모아 15분봉으로 저장합니다(15분봉 RL 재료, 조회 전용). 받은 날은 건너뛰고 이어 받습니다.
# 처음 1년치를 채우는 동안은 장이 끝난 저녁 · 밤에 여러 번(한 번에 4만 번), 다 채운 뒤에는 그날 것만 받습니다(부를 것이 없으면 바로 끝남).
# 장중 1시간봉 알림(hourly-a-live)과 한투 조회 한도가 겹치지 않게 장중(09:00 ~ 15:30)엔 돌지 않습니다.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 부를 최대 수(하루치 = 종목당 4번)'
        required: false
        default: '40000'
      call_gap:
        description: '조회 사이 쉬는 초(기본 0.07 · 장중 빈 시간에 받을 땐 0.15처럼 늦춤)'
        required: false
        default: '0.07'
      lanes:
        description: '동시에 묻는 줄 수(한 번 묻는 데 약 1초라 줄이 많을수록 빠름 · 한투 한도 초당 20번 안)'
        required: false
        default: '12'
  schedule:
    - cron: '20 8,11,14,17,20 * * *'   # 한국 시각 17:20 · 20:20 · 23:20 · 02:20 · 05:20
permissions:
  contents: write
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_collect_kis_m15 -v
      - name: Collect and save
        # 5천 번마다 저장(멈추거나 시간 제한에 걸려도 받은 만큼은 남음 · 2026-10-01 고침). 받은 날은 건너뛰므로 이어 받음.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          total=${MAX_TOTAL:-40000}; left=$total; status=3
          while [ "$left" -gt 0 ]; do
            chunk=$(( left < 5000 ? left : 5000 ))
            status=0; KIS_HOURLY_MAX_CALLS=$chunk python collect_kis_m15.py || status=$?
            mkdir -p m15-kis
            git add -A m15-kis
            if ! git diff --cached --quiet; then
              git commit -q -m "15분봉 받기 · 5천 번 몫"
              # rebase가 충돌로 멈추면 그 뒤 저장이 모두 막혔음(2026-10-01, 약 57종목치를 잃음) → 합치기(merge)로 하고, 충돌 땐 새로 받은 쪽을 씀
              for try in 1 2 3 4 5; do
                git pull -q --no-rebase --no-edit -X ours origin main && git push -q && break
                git merge --abort 2>/dev/null; git rebase --abort 2>/dev/null
                echo "올리기 다시 시도 $try"; sleep $((try * 7))
              done
            fi
            left=$(( left - chunk ))
            [ "$status" = "3" ] || break       # 3 = 이번 몫을 다 부름(더 받을 것이 있음) · 그 밖은 다 받았거나 문제가 있음
          done
          if [ "$status" = "3" ] || [ "$status" = "0" ]; then echo '이번 몫을 다 받았습니다.'; exit 0; fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: ${{ inputs.call_gap || '0.07' }}
          KIS_HOURLY_START: '20250917'
          MAX_TOTAL: ${{ inputs.max_calls || '40000' }}
          KIS_HOURLY_LANES: ${{ inputs.lanes || '12' }}
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
