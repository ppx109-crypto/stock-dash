name: KIS 15-minute bars
# 한국투자증권 1분봉(약 1년치)을 모아 15분봉으로 저장합니다(15분봉 RL 재료, 조회 전용). 받은 날은 건너뛰고 이어 받습니다.
# 처음 1년치를 채우는 동안은 장이 끝난 저녁 · 밤에 여러 번(한 번에 4만 번), 다 채운 뒤에는 그날 것만 받습니다(부를 것이 없으면 바로 끝남).
# 장중 1시간봉 알림(hourly-a-live)과 한투 조회 한도가 겹치지 않게 장중(09:00 ~ 15:30)엔 돌지 않습니다.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 부를 최대 수(하루치 = 종목당 4번)'
        required: false
        default: '40000'
  schedule:
    - cron: '20 8,11,14,17,20 * * *'   # 한국 시각 17:20 · 20:20 · 23:20 · 02:20 · 05:20
permissions:
  contents: write
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_collect_kis_m15 -v
      - name: Collect and save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python collect_kis_m15.py || status=$?
          mkdir -p m15-kis
          git add -A m15-kis
          if ! git diff --cached --quiet; then
            git commit -q -m "Collect KIS 15-minute bars"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          if [ "$status" = "3" ]; then echo '이번 몫을 다 불렀습니다. 다음 예약에 이어 받습니다.'; exit 0; fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          KIS_HOURLY_START: '20250917'
          KIS_HOURLY_MAX_CALLS: ${{ inputs.max_calls || '40000' }}
