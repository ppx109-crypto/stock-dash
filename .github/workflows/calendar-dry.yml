name: Trade calendar dry run
# BOOST-0001-D D5(GPT 구현 검토 6705430244 §2-B · §4-1 · 2c단계): 달력 도구를 마른 실행(--dry-run --out)으로 돌려
# 원문(KRX 휴장일 · 세션 원천 · 평소 세션이 아직 고정되지 않았으면 후보 안내 원문) · 정규화 지문 · 만들 판 후보를 artifact(calendar-dry)로 남김.
# 커밋 · 올리기 없음 · calendar/ 운영 파일을 쓰지 않음(쓰면 이 작업이 실패) · 증권사 응답 본문은 남기지 않음(지문만).
# 키는 calendar.yml과 같은 Secrets 이름(시세용 연결 broker_kis.market(): KIS_APP_KEY · KIS_APP_SECRET · KIS_ENV=real · KIS_TOKEN_FILE).
on:
  pull_request:
    paths:
      - 'calendar/**'
      - 'tools/build_calendar.py'
      - 'trade_calendar.py'
      - 'collect_kis_intraday.py'
      - '.github/workflows/calendar-dry.yml'
  workflow_dispatch:
    inputs:
      years:
        description: '마른 실행할 해(쉼표 구분 · 비우면 올해, 12월이면 다음 해도)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: trade-calendar-dry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 달력 도구 마른 실행(원천 · 지문 · 만들 판 후보 → calendar-dry/)
        run: python tools/build_calendar.py --dry-run --out calendar-dry
        env:
          CAL_YEARS: ${{ inputs.years || '' }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
      - name: 운영 달력 파일을 안 썼는지 확인
        if: always()
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all -- calendar)"
          if [ -n "$changed" ]; then echo "⚠️ 마른 실행이 calendar/를 바꿈: $changed"; exit 1; fi
          echo 'calendar/ 그대로'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-dry
          path: calendar-dry/
          if-no-files-found: warn
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
