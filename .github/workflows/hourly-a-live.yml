name: Hourly A group live
# 1시간봉 A그룹(연구 90회차 최종 규칙) — 장중 1시간마다 방금 닫힌 1시간봉으로 매수 · 자리 바꾸기 · 익절 · 손절 · 청산을 판단해
# 디스코드로 알립니다(연습 계좌만 따라감 · 주문은 넣지 않음 · 증권사 연결은 조회 전용). 후보는 저녁 A그룹 작업이 hourly-live/plan.json으로 남깁니다.
# GitHub 예약은 몇 분 늦게 돌 수 있어, 늦으면 밀린 봉을 차례로 처리합니다.
on:
  workflow_dispatch:
  schedule:
    - cron: '1 1,2,3,4,5 * * 1-5'   # 한국 시각 10:01 · 11:01 · 12:01 · 13:01 · 14:01(평일)
    - cron: '31 6 * * 1-5'          # 한국 시각 15:31(마감 봉 · 14시 봉은 15:30까지)
permissions:
  contents: write
concurrency:
  group: hourly-a-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - run: python -m unittest tests.test_hourly_a -v
      - name: 1시간봉 판단 · 디스코드 알림 · 연습 계좌 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python hourly_a.py live || status=$?
          mkdir -p hourly-live
          git add -A hourly-live
          if ! git diff --cached --quiet; then
            git commit -q -m "Hourly A group live"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
