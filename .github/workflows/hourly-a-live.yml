name: Hourly A group live
# 1시간봉 A그룹(연구 90회차 최종 규칙) — 장중 1시간마다 방금 닫힌 1시간봉으로 매수 · 자리 바꾸기 · 익절 · 손절 · 청산을 판단해
# 디스코드로 알립니다(연습 계좌를 따라가고, 모의투자 비밀값이 있으면 한투 모의투자 계좌에만 시장가 주문 · 실전 계좌 주문은 없음). 후보는 저녁 A그룹 작업이 hourly-live/plan.json으로 남깁니다.
# GitHub 예약은 몇 분 늦게 돌 수 있어, 늦으면 밀린 봉을 차례로 처리합니다.
on:
  workflow_dispatch:
  schedule:
    - cron: '1 0 * * 1-5'           # 한국 시각 09:01(평일) — 전날 마지막 봉 · 일봉 정배열 깨짐으로 정한 매도를 오늘 09시 시가에
    - cron: '1 1,2,3,4,5 * * 1-5'   # 한국 시각 10:01 · 11:01 · 12:01 · 13:01 · 14:01(평일)
    - cron: '31 6 * * 1-5'          # 한국 시각 15:31(마감 봉 · 14시 봉은 15:30까지)
permissions:
  contents: write
  actions: read
concurrency:
  group: hourly-a-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: gate
        name: 장중 상주 작업(Intraday runner)이 돌면 건너뜀 — 이 예약은 뒷받침용
        run: |
          [ "${{ github.event_name }}" = schedule ] || exit 0
          n=""
          for i in 1 2 3; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/intraday.yml/runs?status=in_progress" --jq '.total_count' 2>/dev/null || true)
            case "$n" in ''|*[!0-9]*) n=""; sleep 5;; *) break;; esac
          done
          if [ -z "$n" ]; then
            # 상주 작업이 도는지 끝내 모르면 건너뜀(둘이 같은 봉을 처리해 주문이 겹치는 것보다 한 회차 늦는 게 나음 · 봇이 밀린 봉을 처리)
            echo "상주 작업 확인에 실패해 이번 예약은 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ "$n" -gt 0 ]; then
            echo "장중 상주 작업이 돌고 있어 이번 예약은 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: main
      - if: steps.gate.outputs.skip != '1'
        uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.skip != '1'
        run: pip install requests numpy
      - if: steps.gate.outputs.skip != '1'
        run: python -m unittest tests.test_hourly_a tests.test_paper_trade -v
      - if: steps.gate.outputs.skip != '1'
        name: 1시간봉 판단 · 디스코드 알림 · 연습 계좌 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python hourly_a.py live || status=$?
          mkdir -p hourly-live
          mkdir -p basket-live && git add -A hourly-live idle-live basket-live          # 규칙이 살 돈이 모자라 빈칸 엔진이 자리를 내준 기록도
          if ! git diff --cached --quiet; then
            git commit -q -m "Hourly A group live"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 한투 모의투자 자동 주문(사용자 결정 2026-10-01 '가'). 세 비밀값이 다 있어야 주문하고, 없으면 알림만.
          # 끄려면 hourly-live/paper-off 파일을 만들거나 PAPER_TRADING을 'off'로.
          # 2026-10-03 최종 조합: 1시간봉은 모의 주문 끔(알림 · 연습 계좌는 그대로) — 1일봉 50 · 15분봉 50 · 빈칸 엔진이 계좌를 씀
          PAPER_TRADING: 'off'
          PAPER_START: '20261002'          # 모의투자는 2026-10-02부터(사용자 결정)
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT: ${{ secrets.KIS_PAPER_ACCOUNT }}
          KIS_PAPER_TOKEN_FILE: ${{ runner.temp }}/kis-paper-token.json
      - if: always() && steps.gate.outputs.skip != '1'
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
