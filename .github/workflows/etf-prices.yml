name: ETF daily prices (research)
# 하락 · 옆걸음장 연구용 상장지수펀드 일봉(인버스 · 지수)을 etf-data에 받습니다(조회 전용 · 사용자 요청 2026-10-02).
# 운영 일봉(price-data)과 폴더를 나눠 운영 후보에 섞이지 않게 합니다. 한투 수집 줄(kis-collect)과 따로 돌아 기다리는 운영 작업을 취소하지 않습니다.
on:
  schedule:
    - cron: '50 8 * * 1-5'   # 한국 시각 17:50 — 그날 종가 이어 붙이기
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드(쉼표). 비우면 기본 목록'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: etf-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect ETF prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 토큰은 1분에 한 번만 나옴 — 다른 한투 작업과 겹쳐 거절되면 70초 쉬고 한 번 더
          python collect_prices.py || { sleep 70; python collect_prices.py; } || true
          git add -A etf-data
          if ! git diff --cached --quiet; then
            git commit -q -m 'Collect ETF daily prices (research)'
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((try * 7)); done
          fi
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          PRICE_OUT: etf-data
          PRICE_SKIP_DONE: '1'
          PRICE_WORKERS: '2'
          # 114800 KODEX 인버스 · 251340 KODEX 코스닥150선물인버스 · 252670 KODEX 200선물인버스2X ·
          # 069500 KODEX 200 · 229200 KODEX 코스닥150 · 122630 KODEX 레버리지
          PRICE_CODES: ${{ inputs.codes || '114800,251340,252670,069500,229200,122630' }}
