name: Daily rule live (종가 출격)
# 일봉 최고 규칙(새 82회차)을 실제 날에 — 15:20 마감 직전 값으로 판단 → 한투 모의투자 계좌에 시장가 주문(마감 동시호가 → 종가 체결)
# → 15:32 진짜 종가로 연습 계좌에 적고 디스코드로 알림. 실전 계좌 주문은 없음. 거래 내역은 daily-live/에 남김.
# GitHub 예약은 늦게 돌 수 있어 일찍(14:40 · 15:00) 띄우고 15:20까지 기다림. 두 번째는 첫 번째가 끝냈으면 그냥 끝남.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1-5'          # 한국 시각 14:40(평일)
    - cron: '0 6 * * 1-5'           # 한국 시각 15:00(평일, 첫 예약이 밀렸을 때)
permissions:
  contents: write
concurrency:
  group: daily-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - run: python -m unittest tests.test_daily_live tests.test_paper_trade tests.test_idle_live tests.test_idle_signal tests.test_basket_live tests.test_acc_cap tests.test_overlay_live -v
      - name: 사건 바구니 C · 빈칸 엔진 · 코스닥 과열 인버스(15:10 판단 · 모의투자 주문 · 1일봉보다 먼저)
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python idle_live.py || status=$?
          mkdir -p idle-live basket-live overlay-live
          git add -A idle-live basket-live overlay-live
          if ! git diff --cached --quiet; then
            git commit -q -m "Idle engine live"
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '⚠️ 장부를 저장소에 올리지 못했습니다(내일 낡은 장부로 시작할 수 있음) — 확인 필요'; exit 1; }
          fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BUFFER: ${{ runner.temp }}/discord-bundle.json   # 알림을 모았다가 작업 끝에 한 번만 보냄(사용자 2026-10-14)
          # 빈칸 엔진 모의투자(사용자 2026-10-03 "최종 규칙 정하고 모의투자 제작") · 2026-10-05부터
          # 계좌 흔들림 상한(acc_cap.py · ACC-VOL-0007 · 사용자 2026-10-09 "main에 넣고 켜라") · 모의투자만 · 바구니 · 엔진 사기 한도
          ACC_CAP: 'on'
          ACC_CAP_START: '20261012'
          PAPER_TRADING: 'on'
          PAPER_START: '20261002'
          IDLE_START: '20261005'
          # MIX-0054 최종 판(사용자 2026-10-11 승인 · #224 · 운영 계산 #226): 덧붙임(레버리지 · 횡보 인버스) · 바구니 몫 0.3 · 15분봉 뺌.
          # 사용자 2026-10-11 "오늘 일요일이지만 오늘부터 키자" → 켬(첫 거래일 10-12). 끄려면 세 작업(이것 · 1일봉 · 15분봉) 모두 'off'.
          MIX54: 'on'
          MIX54_START: '20261011'
          LIVE_GIT_SYNC: '1'               # 15:10 판단 직전에 저장소를 최신으로(장중 상주가 올린 장부와 부딪히지 않게)
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT: ${{ secrets.KIS_PAPER_ACCOUNT }}
          KIS_PAPER_TOKEN_FILE: ${{ runner.temp }}/kis-paper-token.json
      - name: 종가 출격 판단 · 모의투자 주문 · 연습 계좌 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python daily_live.py || status=$?
          mkdir -p daily-live basket-live m15-live hourly-live overlay-live
          git add -A daily-live idle-live basket-live m15-live hourly-live overlay-live    # 흔들림 상한이 다른 규칙 장부에서 덜어낸 기록도
          if [ -f acc-cap/log.json ]; then git add acc-cap/log.json; fi
          if ! git diff --cached --quiet; then
            git commit -q -m "Daily rule live"
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '⚠️ 장부를 저장소에 올리지 못했습니다(내일 낡은 장부로 시작할 수 있음) — 확인 필요'; exit 1; }
          fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BUFFER: ${{ runner.temp }}/discord-bundle.json   # 알림을 모았다가 작업 끝에 한 번만 보냄(사용자 2026-10-14)
          # 한투 모의투자 자동 주문(사용자 요청 2026-10-01). 계좌 하나를 1시간봉과 반씩 나눠 씀(PAPER_SHARE 0.5).
          # 계좌 흔들림 상한(acc_cap.py) · 15:20 덜어내기 · 1일봉 사기 한도 · 15:32 종가 비교 기록
          ACC_CAP: 'on'
          ACC_CAP_START: '20261012'
          PAPER_TRADING: 'on'
          PAPER_START: '20261002'          # 모의투자는 2026-10-02부터(사용자 결정)
          DAILY_START: '20261002'          # 종가 출격도 2026-10-02부터
          MIX54: 'on'                     # MIX-0054(위 단계와 같은 값)
          MIX54_START: '20261011'
          LIVE_GIT_SYNC: '1'               # 15:20 판단 직전에 저장소를 최신으로
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT: ${{ secrets.KIS_PAPER_ACCOUNT }}
          KIS_PAPER_TOKEN_FILE: ${{ runner.temp }}/kis-paper-token.json
      - name: 디스코드 알림 한 번에 보내기(빈칸 엔진 · 흔들림 상한 · 1일봉 판단 · 체결 모음)
        if: always()
        run: python notify_discord.py --flush "${{ runner.temp }}/discord-bundle.json" "종가 작업 $(TZ=Asia/Seoul date +%m-%d) 모음" || echo '디스코드 모음 보내기 실패'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
