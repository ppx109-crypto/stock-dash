name: Bot watch (봇 지킴이)
# 평일 16:10(한국 시각)에 오늘 1일봉 · 15분봉 · 빈칸 엔진 모의투자 봇이 제대로 돌았는지 보고, 빠졌거나 늦었으면 디스코드로 알림(run_watch.py).
# 저장소의 봇 장부만 읽음 · 주문 · 키 사용 없음(웹훅만 Secrets).
# 끝에 오늘 쌓인 한투 알림을 '장 마감 모음' 한 통으로 보냄(사용자 2026-10-15 하루 1~2번 · ⚠️ 급한 알림만 바로 나감).
on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5'          # 한국 시각 16:10(평일)
permissions:
  contents: write                   # 보낸 모음 파일을 지워 올림
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - run: python -m unittest tests.test_run_watch -v
      - name: 오늘 봇 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDLE_START: '20261005'
          MIX54_START: '20261011'           # 레버리지 봇(최종 판) 시작 날 — 일봉 작업과 같은 값
          DISCORD_DIGEST: discord-digest
        run: python run_watch.py
      - name: 한투 장 마감 모음 한 통으로 보내기(하루 두 번 중 첫 번째)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull -q --rebase --autostash origin main || true
          python notify_discord.py --digest-flush discord-digest "한투 모의투자 $(TZ=Asia/Seoul date +%m-%d) 장 마감 모음" || echo '디스코드 모음 보내기 실패'
          mkdir -p discord-digest && git add -A discord-digest
          if ! git diff --cached --quiet; then
            git commit -q -m "Discord closing digest sent"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
