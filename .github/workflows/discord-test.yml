name: Discord test
# 저장소에 있는 오늘의 A그룹(study/a_group.json)을 디스코드로 바로 한 번 보냅니다(시험용). 계산은 하지 않습니다.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo '비밀값 DISCORD_WEBHOOK_URL이 비어 있습니다. Settings → Secrets and variables → Actions → Repository secrets에 같은 이름으로 넣어 주세요.'
            exit 1
          fi
          python notify_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
