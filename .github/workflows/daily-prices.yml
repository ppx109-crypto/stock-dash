name: Daily price history
# 일봉과 증권사 목표주가를 받아 저장소에 모읍니다. 조회 전용입니다.
# 앱이 도는 서버에서는 이 호출이 막힐 수 있어 여기서 돌립니다.
on:
  # DART 수집이 끝나면 이어서 돕니다. 따로 시각을 잡아 두면 DART가 늦어진 날
  # 옛 재무로 조사하게 되고, 증권사 토큰도 하루 두 번 받게 됩니다.
  workflow_run:
    workflows: ["Daily DART refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 public-data에 있는 전체)'
        required: false
        default: ''
      years:
        description: '몇 해치를 받을지'
        required: false
        default: '30'
permissions:
  contents: write
concurrency:
  group: price-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_prices.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          # 한 번 받은 토큰을 이 작업 안에서 함께 씁니다. 증권사가
          # 잦은 재발급을 제한하기 때문입니다. 작업이 끝나면 사라집니다.
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          PRICE_CODES: ${{ inputs.codes || '' }}
          PRICE_YEARS: ${{ inputs.years || '30' }}
      - run: python collect_opinions.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
        continue-on-error: true

      - run: python collect_flows.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
        continue-on-error: true

      - name: Save only when something actually changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p price-data
          git add -A price-data opinion-data flow-data
          if git diff --cached --quiet; then
            echo '바뀐 일봉이 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh daily price history'
            git pull --rebase origin main
            git push
          fi
