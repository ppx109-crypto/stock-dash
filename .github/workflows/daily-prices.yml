name: Daily price history
# 일봉과 증권사 목표주가를 받아 저장소에 모읍니다. 조회 전용입니다.
# 앱이 도는 서버에서는 이 호출이 막힐 수 있어 여기서 돌립니다.
on:
  # DART 수집이 끝나면 이어서 돕니다. 따로 시각을 잡아 두면 DART가 늦어진 날
  # 옛 재무로 조사하게 되고, 증권사 토큰도 하루 두 번 받게 됩니다.
  workflow_run:
    workflows: ["Daily DART refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 public-data에 있는 전체)'
        required: false
        default: ''
      years:
        description: '몇 해치를 받을지'
        required: false
        default: '30'
      batch:
        description: '한 묶음에 몇 종목씩 받고 커밋할지'
        required: false
        default: '60'
permissions:
  contents: write
concurrency:
  # 거래량 수집과 같은 줄입니다. 증권사 토큰이 하루 한 번이라 겹치면
  # 나중에 시작한 쪽이 인증에서 막힙니다.
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      # 나눠 받고 묶음마다 커밋합니다. 예전에는 끝에 한 번만 커밋해서,
      # 작업이 제한 시간에 걸리면 받아 둔 서른 해치가 통째로 날아갔습니다.
      - name: Collect prices in batches, saving each batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY' > /tmp/batches.txt
          import json, os, re
          from pathlib import Path
          picked = [c.strip() for c in os.getenv("PRICE_CODES", "").split(",") if c.strip()]
          if not picked:
              try:
                  picked = [str(c) for c in json.loads(
                      Path("universe.json").read_text(encoding="utf-8")).get("codes", [])]
              except (OSError, ValueError):
                  picked = []
          if not picked:
              picked = sorted(p.stem for p in Path("public-data").glob("*.json")
                              if re.fullmatch(r"[0-9]{6}", p.stem))
          # 이미 받아 둔 것을 뒤로 돌려, 아직 없는 종목부터 받습니다.
          have = {p.stem for p in Path("price-data").glob("*.json")}
          picked = [c for c in picked if c not in have] + [c for c in picked if c in have]
          size = int(os.getenv("PRICE_BATCH", "60"))
          for k in range(0, len(picked), size):
              print(",".join(picked[k:k + size]))
          PY
          while read -r batch; do
            [ -z "$batch" ] && continue
            PRICE_CODES="$batch" python collect_prices.py || true
            git add -A price-data
            if git diff --cached --quiet; then
              echo '이 묶음에서 바뀐 일봉이 없습니다.'
            else
              git commit -m 'Refresh daily price history'
              # 묶음마다 올림 · 부딪히면 다시(최대 5번) — 끝내 못 올려도 다음 묶음 때 함께 올라가니 멈추지 않음(2026-10-06 검토)
              for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            fi
          done < /tmp/batches.txt
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          # 한 번 받은 토큰을 이 작업 안에서 함께 씁니다. 증권사가
          # 잦은 재발급을 제한하기 때문입니다. 작업이 끝나면 사라집니다.
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          PRICE_CODES: ${{ inputs.codes || '' }}
          PRICE_YEARS: ${{ inputs.years || '30' }}
          PRICE_BATCH: ${{ inputs.batch || '60' }}
      - run: python collect_opinions.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
        continue-on-error: true

      - run: python collect_flows.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
        continue-on-error: true

      # A그룹 공통 조건(외국인·투신 순매수, 개인 순매도)에 쓰는 수급을 하루치씩 붙입니다(97회차).
      - run: python collect_investor_history.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
        continue-on-error: true

      - name: Save only when something actually changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p price-data
          mkdir -p investor-data
          git add -A price-data opinion-data flow-data investor-data
          if git diff --cached --quiet; then
            echo '바뀐 것이 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh opinions and flows'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
