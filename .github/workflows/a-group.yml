name: A group
# 일봉 수집이 끝나면 오늘의 A그룹(연구 89회차 최종 조건)을 셉니다.
# 앱은 study/a_group.json을 읽어 '오늘의 A그룹'과 관심종목 A그룹에 씁니다.
# Signal study와 따로 둔 것은, 그쪽이 한 시간 제한에 걸려 멈추는 날에도
# A그룹은 제때 나와야 하기 때문입니다.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily price history"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: a-group
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: A그룹 셈 테스트
        run: python -m unittest tests.test_final_group -v
      - run: python final_group.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
      - name: Save only when the list changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study/a_group.json study/names.json 2>/dev/null || git add study/a_group.json
          if git diff --cached --quiet; then
            echo '바뀐 것이 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh the A group'
            git pull --rebase origin main
            git push
          fi
      - name: Send today's A group to Discord
        # 웹훅 주소는 GitHub Secrets의 DISCORD_WEBHOOK_URL에만 둡니다. 없으면 보내지 않고 넘어갑니다.
        run: |
          pip install requests
          python notify_discord.py || echo '디스코드 알림은 실패했지만 A그룹 저장은 끝났습니다.'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 1시간봉 A그룹 — 다음 거래일 후보 · 정배열 깨진 보유 종목 청산 알림
        # 연구 90회차 최종 규칙(사용자 허락 2026-10-01). 오늘 종가 · 오늘 수급까지로 후보를 셉니다. 주문은 넣지 않습니다.
        run: |
          pip install numpy
          status=0; python hourly_a.py plan || status=$?
          mkdir -p hourly-live
          git add -A hourly-live
          if ! git diff --cached --quiet; then
            git commit -q -m "Hourly A group plan"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          exit $status
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
