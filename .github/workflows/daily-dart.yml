name: Daily DART refresh
# 장 마감 뒤 하루 한 번, 모아 둔 종목의 DART 자료를 다시 받습니다.
# 바뀐 자료가 있을 때만 커밋합니다. 커밋하면 Streamlit이 다시 시작되고, 다시
# 시작하면 실행 서버에 저장된 관심종목과 투자일지가 지워지기 때문입니다.
on:
  schedule:
    # 한국 시간 평일 18:00 (UTC 09:00). 장 마감(15:30)과 공시 반영 뒤입니다.
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 public-data에 있는 전체)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: public-dart-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 다트 하루치 갱신 시험
        run: python -m unittest tests.test_dart_daily tests.test_resume -v
      # 시장 전체 공시 목록을 한 번에 받아 종목마다 붙이고, 정기보고서가 새로 나온 종목 등만
      # 처음부터 다시 받습니다(4갈래). 150분이 넘으면 남은 것은 다음 날로 넘겨, 뒤의 일봉 · A그룹이 밀리지 않게 합니다.
      - run: python collect_daily.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          PUBLIC_CODES: ${{ inputs.codes || '' }}
          PUBLIC_LANES: '4'
          PUBLIC_DEADLINE_MIN: '150'
      - name: Save only when something actually changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/ research/
          if git diff --cached --quiet; then
            echo '바뀐 자료가 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh DART data after the close'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
