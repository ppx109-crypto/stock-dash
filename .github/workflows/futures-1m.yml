name: Futures 1min daily
# 2026-10-26: Actions가 10-23에 꺼졌다 다시 켜진 뒤 예약(schedule)이 하나도 안 돌아, 예약을 다시 걸려고 이 줄을 더함.
# 미니 코스피200 · 코스피200 · 코스닥150 선물 1분봉을 날마다 받아 futures-1m/에 쌓습니다(한국투자증권 조회 전용).
# 사용자 2026-10-13 "16시에 미니코스피 선물, 코스피선물, 코스닥 선물 1m자료를 전부 다운로드(내가 전달해줬던 파일처럼)".
# 키움 파일과 같은 모양(datetime,code,open,high,low,close,volume) · 10-12 하루 411줄이 키움 파일과 한 칸도 안 다름(시험 확인).
# 휴일이면 그날 줄이 없어 저장하지 않습니다. 같은 날을 다시 받으면 그날 줄만 바꿔 씁니다.
on:
  schedule:
    - cron: '0 7 * * 1-5'          # 한국 시각 16:00(평일) — 15:45 단일가까지 끝난 뒤
  workflow_dispatch:
    inputs:
      day:
        description: '받을 날(YYYYMMDD · 비우면 오늘)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: futures-1m
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_collect_fut_1min -v
      - name: Collect and save
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          DAY: ${{ inputs.day || '' }}
        run: |
          status=0; python collect_fut_1min.py collect $DAY || status=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p futures-1m; git add -A futures-1m
          if ! git diff --cached --quiet; then
            git commit -q -m "Collect futures 1min ($(TZ=Asia/Seoul date +%F))"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          if [ "$status" = "3" ]; then echo '세 상품 모두 자료 없음(휴일로 봄)'; fi
      - if: always()
        uses: ./.github/actions/kis-token-close
        continue-on-error: true
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
