name: Pick the study universe
# 시가총액 순으로 조사 대상을 고릅니다. DART 상장사 목록 + 증권사 시세입니다.
on:
  workflow_dispatch:
    inputs:
      size:
        description: '고를 종목 수'
        required: false
        default: '200'
permissions:
  contents: write
concurrency:
  group: study-universe
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python pick_universe.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          # 한 번 받은 토큰을 이 작업 안에서 함께 씁니다. 증권사가
          # 잦은 재발급을 제한하기 때문입니다. 작업이 끝나면 사라집니다.
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          UNIVERSE_SIZE: ${{ inputs.size || '200' }}
      - name: Save the list when it changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A universe.json || true
          if git diff --cached --quiet; then
            echo '바뀐 대상 목록이 없어 커밋하지 않습니다.'
          else
            git commit -m 'Pick the study universe by market cap'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
