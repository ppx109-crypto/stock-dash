name: Probe minute bars
# 1시간봉 연구를 위해 과거 분봉을 얼마나 받을 수 있는지 한 번 찔러 봅니다(조회 전용). 저장하지 않고 줄 수 · 시각 범위만 찍습니다.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Yahoo
        continue-on-error: true
        run: python probe_minute.py yahoo
      - name: KIS
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
        run: python probe_minute.py kis
