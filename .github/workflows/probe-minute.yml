name: Probe minute bars
# 1시간봉 연구를 위해 과거 분봉을 얼마나 받을 수 있는지 한 번 찔러 봅니다(조회 전용). 저장하지 않고 줄 수 · 시각 범위만 찍습니다.
# 야후 · 한국투자증권 둘 다 바로 돕니다(한국투자증권은 스무 번 남짓만 부름).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python probe_minute.py yahoo
  kis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 부르는 횟수가 스무 번 남짓이라 수집 작업을 기다리지 않고 바로 돕니다(수집기는 거절되면 다시 부름).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
        run: python probe_minute.py kis
