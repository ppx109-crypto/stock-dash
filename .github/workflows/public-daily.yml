name: Public daily snapshot
# 그날 상장된 모든 종목의 종가 · 시가총액(공공데이터포털) — 상장폐지 종목까지 담은 '그날의 상위 400'(collect_public_daily.py).
# 한투는 상장폐지 종목 일봉을 주지 않아(2026-09-24 확인) 살아남은 종목만 보는 치우침을 줄이려고 받음. 조회 전용.
on:
  workflow_dispatch:
    inputs:
      since:
        description: '시작날(YYYYMMDD)'
        required: false
        default: '20170102'
      days:
        description: '한 번에 받을 날 수(호출 한도)'
        required: false
        default: '400'
      wide:
        description: '넓게 받기(1이면 대비 · 등락률 · 상장주식수를 더해 public-daily-v2에 저장)'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: public-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_public_daily.py "$SINCE"
        env:
          SINCE: ${{ inputs.since || '20170102' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PUB_MAX_DAYS: ${{ inputs.days || '400' }}
          PUB_WIDE: ${{ inputs.wide || '0' }}
      - name: Save
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p public-daily public-daily-v2
          git add -A public-daily public-daily-v2
          if ! git diff --cached --quiet; then
            git commit -q -m 'Public daily snapshot (상장폐지 포함 그날 상위 종목)'
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '올리지 못했습니다.'; exit 1; }
          fi
