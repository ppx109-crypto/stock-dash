name: Public DART data
# Public teaching examples; business extraction skips the table of contents.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '공개 수업 예제 종목코드 (쉼표 구분, 최대 25개)'
        default: '005930,000660'
        required: true
      excerpt:
        description: '사업보고서 원문까지 받기 (종목당 수십 MB, 느림)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/public-dart.yml'
permissions:
  contents: write
concurrency:
  group: public-dart-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_public_dart.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          PUBLIC_CODES: ${{ inputs.codes || '005930,000660' }}
          PUBLIC_WITH_EXCERPT: ${{ inputs.excerpt && '1' || '0' }}
      - name: Rebuild the research bundle
        if: always()
        run: python build_research_bundle.py
      - name: Save public issuer data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/ research/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public DART teaching examples'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
