name: DART extra history
# DART에서 과거까지 주는 자료를 더 모읍니다(공개 자료). events(주요사항보고서 2017~) · holders(임원·5% 보유, 최근 2년) · quarter(분기 주요계정 2016~) · all
# 하루 호출 한도(2만)를 넘지 않게 멈추며, 다시 돌리면 받은 데서 이어 갑니다.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'events · holders · quarter · all'
        required: false
        default: 'all'
      codes:
        description: '종목코드 (쉼표 구분, 비우면 study/flow_universe.json 전체)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: dart-extra
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_dart_extra -v
      - name: Collect, saving every 50 stocks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY' > /tmp/batches.txt
          import json, os, re
          from pathlib import Path
          picked = [c.strip() for c in os.getenv("PICKED_CODES", "").split(",") if c.strip()]
          if not picked:
              picked = json.loads(Path("study/flow_universe.json").read_text(encoding="utf-8"))["codes"]
          picked = [c for c in picked if re.fullmatch(r"[0-9]{6}", c)]
          for k in range(0, len(picked), 50):
              print(",".join(picked[k:k + 50]))
          PY
          kinds="$KIND"; [ "$kinds" = "all" ] && kinds="events holders quarter"
          for kind in $kinds; do
            while read -r batch; do
              [ -z "$batch" ] && continue
              status=0; INVESTOR_CODES="$batch" python collect_dart_extra.py "$kind" || status=$?
              mkdir -p dart-events holder-data quarter-data
              git add -A dart-events holder-data quarter-data
              if ! git diff --cached --quiet; then
                git commit -q -m "Collect DART extra history ($kind)"
                for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
              fi
              if [ "$status" = "2" ]; then echo '한도·거절로 멈춥니다. 내일 다시 돌리면 이어 갑니다.'; exit 0; fi
            done < /tmp/batches.txt
          done
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          KIND: ${{ inputs.kind || 'all' }}
          PICKED_CODES: ${{ inputs.codes || '' }}
          DART_USED_FILE: /tmp/dart-used.txt
