name: BOOST-D CI
# BOOST-0001-D 필수 CI(GPT 구현 검토 6705430244 §2-C · 2c단계) — 기존 check.yml(main 전체 시험)은 건드리지 않음.
# ① D 묶음(필수): tests.test_boost_d와 D가 고친 봇 · 수집기 · 감사 시험이 모두 통과하고, 모은 시험 이름 · 개수 · 지문 · 도구 지문이
#    고정 파일(tests/fixtures/boost_d_required_tests.json)과 같고 건너뜀 0이어야 green(GPT 구현 검토 판 2 §2-B) · 이름 목록을 artifact(d-bundle)로.
# ② 차이 검사(필수): 같은 러너에서 기준(PR이면 PR의 base · 아니면 main과의 merge-base)과 지금 판의 `discover -s tests` 실패 · 오류 이름
#    집합을 견줘 '지금 실패 ⊆ 기준 실패'이고 시험 수 ≥ 기준 · 건너뜀 ≤ 기준 · 빠진 시험 0 · 새로 건너뜀 0일 때만 green ·
#    두 집합 · 불변식 · 차이를 작업 요약 · artifact(test-diff)로 남김.
# 키 · 증권사 없음(시험은 가짜 · 고정 자료).
on:
  pull_request:
  push:
    branches: [claude/boost-d-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boost-d-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  d-bundle:
    name: D 묶음 시험(필수)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 얼린 결과가 고치기 전 코드(BASE 커밋)의 결과인지 다시 돌려 보는 시험이 그 커밋을 씀
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: D 묶음(모두 통과 · 고정 목록과 같아야 green)
        run: python tools/test_diff.py --bundle tests/fixtures/boost_d_required_tests.json --out d-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-bundle
          path: d-bundle/
          if-no-files-found: warn
  full-diff:
    name: 전체 시험 차이 검사(지금 실패 ⊆ 기준 실패)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 기준 커밋 · merge-base를 찾고 기준 판을 worktree로 꺼내려면 전체 기록이 필요
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 기준 커밋 정하기(PR의 base · 없으면 main과의 merge-base)
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ]; then
            base="$PR_BASE"
          else
            git fetch -q origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "기준 $base · 지금 $(git rev-parse HEAD)"
      - name: 차이 검사(새 실패가 있으면 red)
        run: python tools/test_diff.py --base "${{ steps.base.outputs.sha }}" --out test-diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diff
          path: test-diff/
          if-no-files-found: warn
