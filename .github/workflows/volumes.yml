name: Daily volume history
# 거래량·거래대금을 받아 모읍니다. 조회 전용입니다.
# 종가만으로는 '실제로 살 수 있었나'를 가릴 수 없어 따로 받습니다.
# 일봉 수집과 같은 작업에 붙이면 서른 해치를 두 번 훑느라 시간이 모자랍니다.
on:
  workflow_run:
    workflows: ["Daily price history"]
    types: [completed]
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 price-data에 있는 전체)'
        required: false
        default: ''
      years:
        description: '몇 해치를 받을지'
        required: false
        default: '30'
permissions:
  contents: write
concurrency:
  # 일봉 수집과 같은 줄에 세웁니다. 증권사 토큰은 하루 한 번만 나오므로,
  # 두 작업이 겹치면 나중에 시작한 쪽이 인증에서 바로 막힙니다.
  # 일봉이 203종목에서 멈춰 있던 것이 이것입니다.
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_volumes.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          VOLUME_CODES: ${{ inputs.codes || '' }}
          VOLUME_YEARS: ${{ inputs.years || '30' }}
      - name: Save only when something actually changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p volume-data
          git add -A volume-data
          if git diff --cached --quiet; then
            echo '바뀐 거래량이 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh daily volume history'
            # 다른 작업과 같은 순간에 올리면 거절됨(10-02 · 10-05 거래량이 빠졌던 까닭) → 몇 번 다시 시도
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '거래량을 올리지 못했습니다.'; exit 1; }
          fi
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
