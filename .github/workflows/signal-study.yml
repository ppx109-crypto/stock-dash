name: Signal study
# 모아 둔 일봉으로 그룹이 실제로 맞았는지 세어, 앱이 읽을 결과 파일을 남깁니다.
# 확률 검증 화면의 그룹 성적은 이제 final_study.py가 만듭니다. 이 작업은 날마다 60분 제한에
# 걸려 멈췄으므로, 그룹과 무관한 참고 표 두 개가 필요할 때만 손으로 돌립니다.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal-study
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 미래참조 검사
        run: python -m unittest tests.test_guard -v
      - run: python run_study.py
      - name: Save only when the numbers changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p study
          git add -A study
          if git diff --cached --quiet; then
            echo '바뀐 결과가 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh the signal study'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
