name: Signal study
# 모아 둔 일봉으로 그룹이 실제로 맞았는지 세어, 앱이 읽을 결과 파일을 남깁니다.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily price history"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: signal-study
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 미래참조 검사
        run: python -m unittest tests.test_guard -v
      - run: python run_study.py
      - name: Save only when the numbers changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p study
          git add -A study
          if git diff --cached --quiet; then
            echo '바뀐 결과가 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh the signal study'
            git pull --rebase origin main
            git push
          fi
