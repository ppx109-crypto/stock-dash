name: Disclosure events
# 공시 제목을 날짜와 함께 모읍니다. 본문은 받지 않습니다.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 대상 전체)'
        required: false
        default: ''
      first:
        description: '언제부터'
        required: false
        default: '20150101'
permissions:
  contents: write
concurrency:
  group: disclosure-events
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_events.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          EVENT_CODES: ${{ inputs.codes || '' }}
          EVENT_FIRST: ${{ inputs.first || '20150101' }}
      - name: Save when something changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p event-data
          git add -A event-data
          if git diff --cached --quiet; then
            echo '바뀐 공시가 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh disclosure events'
            git pull --rebase origin main
            git push
          fi
