name: Disclosure events
# 공시 제목을 날짜와 함께 모읍니다. 본문은 받지 않습니다.
on:
  schedule:
    - cron: '30 3 * * 6'   # 토 12:30 한국 시각 — 새 종목이 들어와도 공시 목록이 따라가게(종목마다 처음부터)
    - cron: '20 10 * * 1-5' # 평일 19:20 한국 시각 — 최근 5일 시장 전체 공시만 이어 받기(2026-10-03 · 분위기 점수용 · 수십 번 조회)
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표 구분, 비우면 대상 전체)'
        required: false
        default: ''
      first:
        description: '언제부터'
        required: false
        default: '20150101'
      recent:
        description: '최근 며칠만 이어 받기(0 = 종목마다 처음부터)'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: disclosure-events
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_events.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          EVENT_CODES: ${{ inputs.codes || '' }}
          EVENT_FIRST: ${{ inputs.first || '20150101' }}
          EVENT_RECENT_DAYS: ${{ github.event.schedule == '20 10 * * 1-5' && '5' || inputs.recent || '0' }}
      - name: Save when something changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p event-data
          git add -A event-data
          if git diff --cached --quiet; then
            echo '바뀐 공시가 없어 커밋하지 않습니다.'
          else
            git commit -m 'Refresh disclosure events'
            # 다른 작업과 같은 순간에 올리면 거절됨 → 받아 합친 뒤 다시(최대 5번) · 실패한 합치기는 되돌림(2026-10-06 검토)
            ok=0
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
            [ "$ok" = 1 ] || { echo '저장소에 올리지 못했습니다.'; exit 1; }
          fi
