name: KIS hourly bars
# 한국투자증권 1분봉(약 1년치)을 모아 1시간봉으로 저장합니다(1시간봉 RL 재료, 조회 전용). 받은 날은 건너뛰고 이어 받습니다.
# 처음엔 한 번에 4만 번씩 여러 번 돌려 1년치를 채우고, 그 뒤로는 평일 장 끝난 뒤 그날 것만 받습니다.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 부를 최대 수(하루치 = 종목당 4번)'
        required: false
        default: '40000'
  # 2026-10-02 사용자 결정: 정기 실행 끔 — 같은 한투 1분봉을 15분봉 수집(kis-m15.yml)이 435종목 모두 받고, 1시간봉은 거기서 만듦.
permissions:
  contents: write
concurrency:
  group: kis-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kis-token-open   # 오늘 받아 둔 한투 토큰을 잠긴 보관함에서 꺼냄(하루 1회 원칙)
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest tests.test_collect_kis_hourly -v
      - name: Collect and save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          status=0; python collect_kis_hourly.py || status=$?
          mkdir -p hourly-kis
          git add -A hourly-kis
          if ! git diff --cached --quiet; then
            git commit -q -m "Collect KIS hourly bars"
            for try in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; echo "올리기 다시 시도 $try"; sleep $((try * 7)); done
          fi
          if [ "$status" = "3" ]; then echo '이번 몫을 다 불렀습니다. 다시 돌리면 이어 받습니다.'; exit 0; fi
          exit $status
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          KIS_TOKEN_FILE: ${{ runner.temp }}/kis-token.json
          KIS_CALL_GAP: '0.07'
          KIS_HOURLY_MAX_CALLS: ${{ inputs.max_calls || '40000' }}
      - if: always()
        uses: ./.github/actions/kis-token-close  # 새로 받은 토큰이면 잠가서 보관함에 넣음
        continue-on-error: true   # 보관함이 말썽이어도 봇은 그대로 돎(토큰을 새로 받을 뿐)
        with:
          real-secret: ${{ secrets.KIS_APP_SECRET }}
          paper-secret: ${{ secrets.KIS_PAPER_APP_SECRET }}
