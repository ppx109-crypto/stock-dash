name: DART customers
# 사업보고서 원문을 통째로 보관하고 '주요 매출처 · 주요 고객' 문단을 뽑습니다(공개 자료 · MPOS H2 고객–공급사 연결 · 조회 전용).
# 판 3(GPT #444 round 2 반영): 원문 ZIP은 릴리스 dart-customers-raw-v1에 종목별 내용 지문 묶음으로 올리고(덮어쓰기 금지), 저장소에는 지문 · 문단 · 영수증만 둡니다.
# 50종목마다 저장 · 한 번에 실제 요청 7천 번까지(재시도 · 기업 목록 포함) · 다시 돌리면 이어 받기.
# 다시 돌리기: customer-run.txt를 바꿔 올리거나 손으로 돌립니다.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dart-customers.yml'
      - 'collect_dart_customers.py'
      - 'tools/save_customer_batch.sh'
      - 'tests/check_dart_customers.py'
      - 'tests/check_save_customer_batch.sh'
      - 'customer-run.txt'
permissions:
  contents: write
concurrency:
  group: dart-customers
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python tests/check_dart_customers.py
      - run: bash tests/check_save_customer_batch.sh
      - name: Release for raw documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dart-customers-raw-v1 >/dev/null 2>&1 || \
            gh release create dart-customers-raw-v1 --prerelease --target "$GITHUB_SHA" \
              --title "DART 사업보고서 원문 보관(주요 매출처 연구)" \
              --notes "MPOS-0019 고객–공급사 연결 연구용 DART 공개 원문 ZIP 보관소. 종목별 묶음(raw-<종목>-r<실행번호>.tar). 지문은 customer-data/에 있음."
      - name: Collect
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          GH_TOKEN: ${{ github.token }}
          CUSTOMER_USED_FILE: /tmp/customer_used.txt
          CUSTOMER_BUDGET: '7000'
          CUSTOMER_SAVE_EVERY: '25'
          CUSTOMER_MINUTES: '300'
          CUSTOMER_SAVE_CMD: bash tools/save_customer_batch.sh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo 0 > /tmp/customer_used.txt
          status=0; python collect_dart_customers.py || status=$?
          echo "실제 요청 합계 $(cat /tmp/customer_used.txt) · 끝 상태 $status"
          case "$status" in
            0) echo "모두 받음";;
            2) echo "부분 수집(호출 예산 · 한도) · 다음에 이어 받기";;
            4) echo "미해결 남음(목록 · 원문)"; exit 1;;
            *) exit 1;;
          esac
